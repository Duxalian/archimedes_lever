name: pii-guard
# Repo checks and the personal-data scan in one job (one runner start).
# Pull requests and manual runs only, never on push (AGENTS.md "Verification": Actions minutes).
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Repo checks (self-tests and project log)
        run: scripts/check.sh
      - name: Scan files and commits
        env:
          # Name denylist, one name per line. Set it in Settings > Secrets and variables > Actions.
          PII_GUARD_DENYLIST: ${{ secrets.PII_GUARD_DENYLIST }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Opt-in and allow list come from the PR base, so a PR cannot switch the guard off or widen it.
          ref="${BASE_SHA:-HEAD}"
          if ! git cat-file -e "$ref:.pii-guard" 2>/dev/null; then echo "no .pii-guard file on $ref: guard not enabled"; exit 0; fi
          # No secret (not added, or a fork or Dependabot PR) = the check fails: names must be checked (decision 2A).
          if [ -n "$BASE_SHA" ]; then
            python3 scripts/pii_guard.py --require-denylist --all --range "$BASE_SHA..HEAD" --allow-from "$BASE_SHA"
          else
            python3 scripts/pii_guard.py --require-denylist --all
          fi
